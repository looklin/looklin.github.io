    <script>
        (function($) {
            console.log('%c %c \u2665 梦想万岁 \u2730 %c 虽然我也不知道梦想是什么，总之万岁就对了 '
                , 'background: #f86; padding:5px 0; line-height:14px; margin: 10px 0; font-family: Arial;'
                , 'color: #f86; background: #030307; padding:5px 0;'
                , 'color: #f86; background: #030307; padding:5px 0;')
            skel.breakpoints({
                xlarge: '(max-width: 1680px)',
                large: '(max-width: 1280px)',
                medium: '(max-width: 980px)',
                small: '(max-width: 736px)',
                xsmall: '(max-width: 480px)',
                xxsmall: '(max-width: 360px)'
            });
            $(function() {
                var $window = $(window),
                    $document = $(document),
                    $body = $('body'),
                    $wrapper = $('#wrapper'),
                    $footer = $('#footer');
                $window.on('load', function() {
                    window.setTimeout(function() {
                        $body.removeClass('is-loading-0');
                        window.setTimeout(function() {
                            $body.removeClass('is-loading-1');
                        }, 1500);
                    }, 100);
                });
                $('form').placeholder();
                var $wrapper = $('#wrapper'),
                    $panels = $wrapper.children('.panel'),
                    locked = true;
                $panels.not($panels.first()).addClass('inactive').hide();
                $panels.each(function() {
                    var $this = $(this),
                        $image = $this.children('.image'),
                        $img = $image.find('img'),
                        position = $img.data('position');
                    $image.css('background-image', 'url(' + $img.attr('src') + ')');
                    if (position) $image.css('background-position', position);
                    $img.hide();
                });
                window.setTimeout(function() {
                    locked = false;
                }, 1250);
                $('a[href^="#"]').on('click', function(event) {
                    if ($(this).hasClass('diary-link') || $(this).hasClass('diary-today-link')) {
                        return;
                    }
                    var $this = $(this),
                        id = $this.attr('href'),
                        $panel = $(id),
                        $ul = $this.parents('ul'),
                        delay = 0;
                    event.preventDefault();
                    event.stopPropagation();
                    if (locked) return;
                    locked = true;
                    $this.addClass('active');
                    if ($ul.hasClass('spinX') || $ul.hasClass('spinY')) delay = 250;
                    window.setTimeout(function() {
                        $panels.addClass('inactive');
                        $footer.addClass('inactive');
                        window.setTimeout(function() {
                            $panels.hide();
                            $panel.show();
                            $document.scrollTop(0);
                            window.setTimeout(function() {
                                $panel.removeClass('inactive');
                                $this.removeClass('active');
                                locked = false;
                                $window.triggerHandler('--refresh');
                                window.setTimeout(function() {
                                    $footer.removeClass('inactive');
                                }, 250);
                            }, 100);
                        }, 350);
                    }, delay);
                });
                if (skel.vars.IEVersion < 12) {
                    $window.on('--refresh', function() {
                        $wrapper.css('height', 'auto');
                        window.setTimeout(function() {
                            var h = $wrapper.height(),
                                wh = $window.height();
                            if (h < wh) $wrapper.css('height', '100vh');
                        }, 0);
                        if (skel.vars.IEVersion < 10) {
                            var $panel = $('.panel').not('.inactive'),
                                $image = $panel.find('.image'),
                                $content = $panel.find('.content'),
                                ih = $image.height(),
                                ch = $content.height(),
                                x = Math.max(ih, ch);
                            $image.css('min-height', x + 'px');
                            $content.css('min-height', x + 'px');
                        }
                    });
                    $window.on('load', function() {
                        $window.triggerHandler('--refresh');
                    });
                    $('.spinX').removeClass('spinX');
                    $('.spinY').removeClass('spinY');
                }
            });
            var diaryState = {
                existingFiles: [],
                loaded: false,
                listScrollTop: 0,
                loading: false
            };
            
            function loadDiaryList() {
                if (diaryState.existingFiles.length > 0) {
                    renderList();
                    return;
                }
                
                if (diaryState.loading) {
                    return;
                }
                
                diaryState.loading = true;
                var $container = $('#diary-list-container');
                $container.html('<blockquote>加载列表中...<br/></blockquote>');
                
                $.ajax({
                    url: 'diary/index.json',
                    type: 'GET',
                    dataType: 'json',
                    success: function(dates) {
                        diaryState.existingFiles = [];
                        
                        dates.forEach(function(dateStr) {
                            var parts = dateStr.split('-');
                            var dateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                            diaryState.existingFiles.push({
                                filename: dateStr + '.md',
                                dateStr: parts[0] + '.' + parts[1] + '.' + parts[2],
                                dateObj: dateObj
                            });
                        });
                        
                        diaryState.existingFiles.sort(function(a, b) {
                            return b.dateObj - a.dateObj;
                        });
                        diaryState.loaded = true;
                        renderList();
                    },
                    error: function(xhr) {
                        if (xhr.status === 404) {
                            $container.html('<blockquote>日志索引文件不存在,请先创建 index.json<br/></blockquote>');
                        } else {
                            $container.html('<blockquote>加载失败,请稍后重试<br/></blockquote>');
                        }
                    },
                    complete: function() {
                        diaryState.loading = false;
                    }
                });
            }
            
            function renderList() {
                var $container = $('#diary-list-container');
                
                if (diaryState.existingFiles.length === 0) {
                    $container.html('<blockquote>还没有任何日志,快去创建第一篇吧!<br/></blockquote>');
                    return;
                }
                
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                var todayStr = year + '.' + month + '.' + day;
                var todayFile = year + '-' + month + '-' + day + '.md';
                
                var hasTodayDiary = diaryState.existingFiles.some(function(f) {
                    return f.filename === todayFile;
                });
                
                var html = '';
                if (hasTodayDiary) {
                    html += '<div class="diary-today-section">';
                    html += '<a href="#" class="diary-today-link" data-file="' + todayFile + '" data-date="' + todayStr + '">';
                    html += '<span class="diary-today-label">今日记</span>';
                    html += '<span class="diary-today-date">' + todayStr + '</span>';
                    html += '<span class="diary-arrow">→</span>';
                    html += '</a>';
                    html += '</div>';
                }
                
                html += '<div class="diary-list-header">历史日志 (' + diaryState.existingFiles.length + ' 篇)</div>';
                html += '<ul class="diary-list">';
                diaryState.existingFiles.forEach(function(file) {
                    html += '<li class="diary-list-item">';
                    html += '<a href="#" class="diary-link" data-file="' + file.filename + '" data-date="' + file.dateStr + '">';
                    html += '<span class="diary-date">' + file.dateStr + '</span>';
                    html += '<span class="diary-arrow">→</span>';
                    html += '</a>';
                    html += '</li>';
                });
                html += '</ul>';
                
                $container.html(html);
            }
            
            function showDiaryView(filename, dateStr) {
                $('#diary-title').text('日志详情');
                $('#diary-date').text(dateStr);
                $('#diary-body').html('<blockquote>加载中...<br/></blockquote>');
                
                diaryState.listScrollTop = $('#diary-list-wrapper').scrollTop();
                
                $.ajax({
                    url: 'diary/' + filename,
                    type: 'GET',
                    dataType: 'text',
                    success: function(data) {
                        var htmlContent = marked.parse(data);
                        $('#diary-body').html(htmlContent);
                    },
                    error: function(xhr) {
                        if (xhr.status === 404) {
                            $('#diary-body').html('<blockquote>该日志文件不存在<br/></blockquote>');
                        } else {
                            $('#diary-body').html('<blockquote>加载失败,请稍后重试<br/></blockquote>');
                        }
                    }
                });
                
                $('#diary-list-wrapper').addClass('diary-view-hidden');
                $('#diary-view').removeClass('diary-view-hidden');
                $('#diary-view').scrollTop(0);
            }
            
            function showListView() {
                $('#diary-title').text('日志列表');
                $('#diary-list-wrapper').removeClass('diary-view-hidden');
                $('#diary-view').addClass('diary-view-hidden');
                renderList();
                $('#diary-list-wrapper').scrollTop(diaryState.listScrollTop);
            }
            
            $('#nav a[href="#today"]').on('click', function() {
                showListView();
                loadDiaryList();
            });
            
            $(document).on('click', '.diary-today-link', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var filename = $(this).data('file');
                var dateStr = $(this).data('date');
                showDiaryView(filename, dateStr);
            });
            
            $(document).on('click', '.diary-link', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var filename = $(this).data('file');
                var dateStr = $(this).data('date');
                showDiaryView(filename, dateStr);
            });
            
            $(document).on('click', '#back-to-list-btn', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showListView();
            });
            
            $('#nav a[href="#home"]').on('click', function() {
                diaryState.existingFiles = [];
                diaryState.loaded = false;
                diaryState.loading = false;
            });
        })(jQuery);
    </script>
</body>
