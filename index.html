    <script>
        (function($) {
            console.log('%c %c \u2665 梦想万岁 \u2730 %c 虽然我也不知道梦想是什么，总之万岁就对了 '
                , 'background: #f86; padding:5px 0; line-height:14px; margin: 10px 0; font-family: Arial;'
                , 'color: #f86; background: #030307; padding:5px 0;'
                , 'color: #f86; background: #030307; padding:5px 0;')
            skel.breakpoints({
                xlarge: '(max-width: 1680px)',
                large: '(max-width: 1280px)',
                medium: '(max-width: 980px)',
                small: '(max-width: 736px)',
                xsmall: '(max-width: 480px)',
                xxsmall: '(max-width: 360px)'
            });
            $(function() {
                var $window = $(window),
                    $document = $(document),
                    $body = $('body'),
                    $wrapper = $('#wrapper'),
                    $footer = $('#footer');
                $window.on('load', function() {
                    window.setTimeout(function() {
                        $body.removeClass('is-loading-0');
                        window.setTimeout(function() {
                            $body.removeClass('is-loading-1');
                        }, 1500);
                    }, 100);
                });
                $('form').placeholder();
                var $wrapper = $('#wrapper'),
                    $panels = $wrapper.children('.panel'),
                    locked = true;
                $panels.not($panels.first()).addClass('inactive').hide();
                $panels.each(function() {
                    var $this = $(this),
                        $image = $this.children('.image'),
                        $img = $image.find('img'),
                        position = $img.data('position');
                    $image.css('background-image', 'url(' + $img.attr('src') + ')');
                    if (position) $image.css('background-position', position);
                    $img.hide();
                });
                window.setTimeout(function() {
                    locked = false;
                }, 1250);
                $('a[href^="#"]').on('click', function(event) {
                    var $this = $(this),
                        id = $this.attr('href'),
                        $panel = $(id),
                        $ul = $this.parents('ul'),
                        delay = 0;
                    event.preventDefault();
                    event.stopPropagation();
                    if (locked) return;
                    locked = true;
                    $this.addClass('active');
                    if ($ul.hasClass('spinX') || $ul.hasClass('spinY')) delay = 250;
                    window.setTimeout(function() {
                        $panels.addClass('inactive');
                        $footer.addClass('inactive');
                        window.setTimeout(function() {
                            $panels.hide();
                            $panel.show();
                            $document.scrollTop(0);
                            window.setTimeout(function() {
                                $panel.removeClass('inactive');
                                $this.removeClass('active');
                                locked = false;
                                $window.triggerHandler('--refresh');
                                window.setTimeout(function() {
                                    $footer.removeClass('inactive');
                                }, 250);
                            }, 100);
                        }, 350);
                    }, delay);
                });
                if (skel.vars.IEVersion < 12) {
                    $window.on('--refresh', function() {
                        $wrapper.css('height', 'auto');
                        window.setTimeout(function() {
                            var h = $wrapper.height(),
                                wh = $window.height();
                            if (h < wh) $wrapper.css('height', '100vh');
                        }, 0);
                        if (skel.vars.IEVersion < 10) {
                            var $panel = $('.panel').not('.inactive'),
                                $image = $panel.find('.image'),
                                $content = $panel.find('.content'),
                                ih = $image.height(),
                                ch = $content.height(),
                                x = Math.max(ih, ch);
                            $image.css('min-height', x + 'px');
                            $content.css('min-height', x + 'px');
                        }
                    });
                    $window.on('load', function() {
                        $window.triggerHandler('--refresh');
                    });
                    $('.spinX').removeClass('spinX');
                    $('.spinY').removeClass('spinY');
                }
            });
            function getDiaryFileList() {
                var now = new Date();
                var files = [];
                for (var i = 0; i <= 365; i++) {
                    var date = new Date(now);
                    date.setDate(date.getDate() - i);
                    var year = date.getFullYear();
                    var month = String(date.getMonth() + 1).padStart(2, '0');
                    var day = String(date.getDate()).padStart(2, '0');
                    files.push({
                        filename: year + '-' + month + '-' + day + '.md',
                        dateStr: year + '.' + month + '.' + day,
                        dateObj: date
                    });
                }
                return files;
            }
            
            function loadDiaryList() {
                var fileList = getDiaryFileList();
                var $container = $('#diary-list-container');
                var $list = $('<ul class="diary-list"></ul>');
                var loadedCount = 0;
                var existingFiles = [];
                
                $container.html('<blockquote>加载列表中...<br/></blockquote>');
                
                fileList.forEach(function(file) {
                    $.ajax({
                        url: 'diary/' + file.filename,
                        type: 'HEAD',
                        success: function() {
                            existingFiles.push(file);
                            renderList();
                        },
                        complete: function() {
                            loadedCount++;
                        }
                    });
                });
                
                function renderList() {
                    existingFiles.sort(function(a, b) {
                        return b.dateObj - a.dateObj;
                    });
                    
                    if (existingFiles.length > 0) {
                        $list.empty();
                        existingFiles.forEach(function(file) {
                            var $li = $('<li class="diary-list-item"></li>');
                            var $link = $('<a href="#" class="button small diary-link" data-file="' + file.filename + '" data-date="' + file.dateStr + '">' + file.dateStr + '</a>');
                            $li.append($link);
                            $list.append($li);
                        });
                        $container.html('<p style="margin-bottom: 1em;">历史日志 (' + existingFiles.length + ' 篇)</p>').append($list);
                    } else {
                        $container.html('<blockquote>还没有任何日志,快去创建第一篇吧!<br/></blockquote>');
                    }
                }
            }
            
            function loadDiaryFile(filename) {
                $.ajax({
                    url: 'diary/' + filename,
                    type: 'GET',
                    dataType: 'text',
                    success: function(data) {
                        var htmlContent = marked.parse(data);
                        $('#diary-body').html(htmlContent);
                        $('#diary-date').text(filename.replace('.md', ''));
                        $('#diary-list-container').hide();
                        $('#diary-view').show();
                    },
                    error: function() {
                        $('#diary-body').html('<blockquote>该日志不存在<br/></blockquote>');
                    }
                });
            }
            
            $('#nav a[href="#today"]').on('click', function() {
                $('#diary-title').text('今日记');
                loadDiaryList();
                $('#diary-list-container').show();
                $('#diary-view').hide();
            });
            
            $(document).on('click', '.diary-link', function(e) {
                e.preventDefault();
                var filename = $(this).data('file');
                var dateStr = $(this).data('date');
                loadDiaryFile(filename);
            });
            
            $(document).on('click', '#back-to-list', function(e) {
                e.preventDefault();
                $('#diary-list-container').show();
                $('#diary-view').hide();
            });
        })(jQuery);
    </script>
